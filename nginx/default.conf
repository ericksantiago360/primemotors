# Reverse proxy delante de Gunicorn. Sirve los archivos subidos (media/)
# directamente desde el volumen compartido `media_data`; el resto va a Django.

# Respeta X-Forwarded-Proto si un balanceador/TLS externo lo envía; si no, usa http/https real.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Los uploads se limitan a 5 MB en Django; deja margen para el resto del formulario.
    client_max_body_size 6m;

    location /media/ {
        alias /var/www/media/;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }
}
