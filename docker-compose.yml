services:
  web:
    build: .
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - db_data:/app/data
      - media_data:/app/djangomarketplace/magicbeautybox/media
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro

volumes:
  db_data:
  media_data:
